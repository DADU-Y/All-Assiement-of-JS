<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tahir Kids Navbar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/7.17.2/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/7.17.2/firebase-database.js"></script>
</head>
<body>

<div id="nav1" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">TAHIR <span>KIDS</span></a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link active fw-medium" aria-current="page" href="./index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" href="./shop.html">Shop</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" href="./aboutus.html">About Us</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-medium" href="#">Contact</a>
        </li>
      </ul>
    </div>
  </div>
</div>


<div class="box">
  <h2>Contact Us</h2>
  <form id="contactForm">
    <label>Product Name:</label>
    <input type="text" id="product" />

    <label>Your Name:</label>
    <input type="text" id="name" />

    <label>Your Number:</label>
    <input type="text" id="number" />

    <label>Your City/Address:</label>
    <input type="text" id="city" />

    <button type="button" onclick="sendWhatsApp()">Submit</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
