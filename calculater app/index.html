<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-div">
        <input id="input1" class="input1" type="text">
        <div class="child-div">
        <button onclick="clearinput()" class="btn">AC</button>
        <button onclick="clearlastch()" class="btn">CE</button>
        <button onclick="inputvalue(9)" class="btn">9</button>
        <button onclick="inputvalue('%')" class="btn">%</button>
    </div>
    <div class="child-div">
        <button onclick="inputvalue(8)" class="btn">8</button>
        <button onclick="inputvalue(7)" class="btn">7</button>
        <button onclick="inputvalue(6)" class="btn">6</button>
        <button onclick="inputvalue('*')" class="btn">x</button>
        </div>
        <div class="child-div">
        <button onclick="inputvalue(5)" class="btn">5</button>
        <button onclick="inputvalue(4)" class="btn">4</button>
        <button onclick="inputvalue(3)" class="btn">3</button>
        <button onclick="inputvalue('+')" class="btn">+</button>
        </div>
        <div class="child-div">
        <button onclick="inputvalue(2)" class="btn">2</button>
        <button onclick="inputvalue(1)" class="btn">1</button>
        <button onclick="inputvalue(0)" class="btn">0</button>
        <button onclick="inputvalue('-')" class="btn">-</button>
        </div>
        <div class="child-div">
        <button onclick="calculate()" class="equal-button">=</button>
        <button onclick="inputvalue('.')" class="btn">.</button>
        <button onclick="inputvalue('/')" class="btn">÷</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
